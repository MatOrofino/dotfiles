[cmd_duration]
disabled = false
min_time = 1_500
style = "bg:text"
format = '[[󱎫 $duration](fg:black bg:text)]($style)'

[sudo]
disabled = false
style = "red"
format = "[Sudo ]($style)"

[shell]
disabled = false
style = "bold sapphire"
format = "[$indicator]($style)"


