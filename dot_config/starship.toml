"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
[╭─](magenta)\
[ $os](bg:magenta )\
$directory\
[](fg:magenta bg:lavender)\
$git_branch\
$git_status\
[](fg:lavender bg:sapphire)\
$nodejs\
$rust\
$golang\
$php\
$aws\
$buf\
$bun\
$c\
$cpp\
$cmake\
$conda\
$crystal\
$dart\
$deno\
$java\
$julia\
$kotlin\
$lua\
$meson\
$nim\
$nix_shell\
$ocaml\
$package\
$perl\
$pixi\
$python\
$rlang\
$ruby\
$scala\
$swift\
$xmake\
$zig\
[](fg:sapphire bg:text)\
$time\
$cmd_duration\
[ ](fg:text)\
\n[╰─](magenta)\
$sudo\
$shell $character"""

[directory]
style = "fg:black bg:magenta"
format = "[ $path ]($style)"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Music" = " Music"
"Pictures" = " Pictures"
"Thunder" = "󱐋 Thunder"
"Videos" = "  Videos"

[git_branch]
symbol = ""
style = "bg:lavender"
format = '[[ $symbol $branch ](fg:black bg:lavender)]($style)'

[git_status]
style = "bg:lavender"
format = '[[($all_status$ahead_behind )](fg:black bg:lavender)]($style)'

[nodejs]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[rust]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[golang]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[php]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[aws]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[buf]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[bun]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[c]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[cpp]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[cmake]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[conda]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[crystal]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[dart]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[deno]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[java]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[julia]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[kotlin]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[lua]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[meson]
symbol = "󰔷"
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[nim]
symbol = "󰆥"
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[package]
symbol = "󰏗"
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[perl]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[pixi]
symbol = "󰏗"
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[python]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($virtualenv) ($version) ](fg:black bg:sapphire)]($style)'

[rlang]
symbol = "󰟔"
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[ruby]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[scala]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[status]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[swift]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[xmake]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[zig]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol ($version) ](fg:black bg:sapphire)]($style)'

[time]
disabled = false
time_format = "%R"                                 # Hour:Minute Format
style = "bg:text"
format = '[[  $time ](fg:black bg:text)]($style)'

[os]
disabled = false
style = "bg:magenta fg:#090c0c"

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
