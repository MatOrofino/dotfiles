profile = "heavy"

[plugins]
enabled = ["nomadcxx/gamer-mode"]

[shell]
avatar_path = "/home/orofino/Pictures/Wallpapers/nier4.jpg"
corner_radius_scale = 0.0
external_ip_enabled = true
font_family = "JetBrainsMono Nerd Font Mono"
